name: oidc-claims
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  claim:
    runs-on: ubuntu-latest
    # This environment does not exist in the repository. GitHub is expected to
    # auto-create it unprotected when the job runs.
    environment: production
    steps:
      - name: Mint npm-audience OIDC token and decode its claims
        run: |
          set -e
          RESP=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          TOKEN=$(echo "$RESP" | jq -r .value)
          echo "token_len=${#TOKEN}"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq .
